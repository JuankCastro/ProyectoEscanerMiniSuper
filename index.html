<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>ScanIt</title>
</head>
<body>
    <button class="Btnregister">Escanear Articulo</button>
    <input class="in" type="text" name="" id="" required value="Yummies">
    <div class="datas">
        <input class="in" type="text" name="" id="" value="Ranchita Perrona">
        <label>Categoria</label>
        <select name="" id="" class="Combobox">
            <option value="1">Congelados</option>
        </select>

        <label>Costo de compra</label>
        <div class="CostPrice selecter">
            <input  class="costin" type="number" name="" id="">
            <button class="BtnAdd">R</button>
            <button class="BtnAdd">+25</button>
            <button class="BtnAdd">+100</button>
        </div>

        <label>Precio Estimado</label>
        <div class="CostPrice selecter">
            <input  class="costin" type="number" name="" id="">
            <button class="BtnAdd">R</button>
            <button class="BtnAdd">+25</button>
            <button class="BtnAdd">+100</button>
        </div>
        <button class="Btnregister">Registar</button>
    </div>
    <script>
    document.querySelectorAll('.CostPrice .BtnAdd').forEach(boton => {
        boton.addEventListener('click', () => {
            const contenedor = boton.parentElement;
            const input = contenedor.querySelector('.costin');
            let valorActual = parseFloat(input.value) || 0;
            const accion = boton.textContent.trim();
            if (accion === 'R') {
                input.value = Math.round(valorActual / 25) * 25;
            } else if (accion === '+25') {
                input.value = valorActual + 25;
            } else if (accion === '+100') {
                input.value = valorActual + 100;
            }
        });
    });
</script>
</body>
</html>
